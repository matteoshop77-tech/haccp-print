[package]
name = "haccp-print"
version = "1.0.0"
description = "HACCPrint – Professional label printing"
authors = ["HACCPrint"]
edition = "2021"

[lib]
name = "haccp_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "winspool",
  "wingdi",
  "winnt",
  "minwindef",
  "windef",
  "errhandlingapi",
  "winerror",
] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
